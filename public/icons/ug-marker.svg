<svg width="100" height="120" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pin shape with gradient -->
  <defs>
    <linearGradient id="pinGradient" x1="50" y1="0" x2="50" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#003DA5"/>
      <stop offset="100%" stop-color="#002366"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Pin shape -->
  <path d="M50 0C27.9086 0 10 17.9086 10 40C10 62.0914 50 120 50 120C50 120 90 62.0914 90 40C90 17.9086 72.0914 0 50 0Z" 
        fill="url(#pinGradient)" filter="url(#shadow)"/>
  
  <!-- White circle for logo background -->
  <circle cx="50" cy="40" r="28" fill="white"/>
  
  <!-- UG Logo -->
  <g transform="translate(50, 40)">
    <!-- U letter (left) -->
    <path d="M-12 -10 L-12 2 C-12 6 -10 8 -6 8 C-2 8 0 6 0 2 L0 -10" 
          stroke="#E31E24" stroke-width="5" fill="none" stroke-linecap="round"/>
    
    <!-- G letter (right) -->
    <path d="M12 -10 L12 2 C12 6 10 8 6 8 L2 8 L2 0 L8 0" 
          stroke="#E31E24" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
